server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin API endpoints share /admin/* with SPA routes (например, /admin/orders).
    # Нужно различать "загрузка страницы" (Accept: text/html) и API-запросы.
    # - Браузер при refresh /admin/orders должен получить index.html (SPA), а не JSON от backend.
    # - fetch/POST/PUT/DELETE на эти же пути должны идти в backend.
    location ~ ^/admin/(orders|categories|products)(/|$) {
        # If browser asks for HTML, serve SPA shell.
        error_page 418 =200 /index.html;
        set $is_spa 0;
        if ($http_accept ~* "text/html") { set $is_spa 1; }
        if ($request_method != GET) { set $is_spa 0; }
        if ($is_spa = 1) { return 418; }

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/admin/reload/? {
        proxy_pass http://backend:8000$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location = /admin {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}